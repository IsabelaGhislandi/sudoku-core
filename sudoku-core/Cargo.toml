[package]
name = "sudoku-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Pure Rust engine that generates, solves, validates and rates 9x9 Sudoku puzzles."
readme = "../README.md"
keywords = ["sudoku", "puzzle", "solver", "generator", "game"]
categories = ["games", "algorithms"]
# O crate não é publicado no crates.io: ele é consumido pelo próprio app.
publish = false

[dependencies]
# Sem as features padrão: elas trazem StdRng, ThreadRng e acesso à aleatoriedade do sistema
# (chacha20, getrandom...). O core é determinístico e só usa SeedableRng e shuffle; o
# gerador vem do rand_chacha.
rand = { version = "0.10", default-features = false }
rand_chacha = "0.10.0"
