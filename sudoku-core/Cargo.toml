[package]
name = "sudoku-core"
version = "0.1.0"
edition = "2024"
# O crate não é publicado no crates.io: ele é consumido pelo próprio app. Isso também tira
# o sudoku-core da checagem de licenças do cargo-deny (ver deny.toml).
publish = false

[dependencies]
# Sem as features padrão: elas trazem StdRng, ThreadRng e acesso à aleatoriedade do sistema
# (chacha20, getrandom...). O core é determinístico e só usa SeedableRng e shuffle; o
# gerador vem do rand_chacha.
rand = { version = "0.10", default-features = false }
rand_chacha = "0.10.0"
