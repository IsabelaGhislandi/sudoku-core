# Configuração do cargo-deny: o que o CI verifica nas dependências a cada PR e toda semana.
# Detalhes e motivos em docs/wiki/28-seguranca-de-dependencias.md.
# Rodar localmente, de qualquer pasta do repositório: cargo deny check

[graph]
# O app vai rodar em Android e desktop: as dependências de qualquer plataforma contam.
all-features = true

[advisories]
# Banco de vulnerabilidades da RustSec. Crates sem manutenção ou retirados do crates.io
# (yanked) também falham, porque não vão receber correção.
version = 2
yanked = "deny"
unmaintained = "all"
# Exceções exigem um ID e o motivo, num comentário ao lado. Hoje não há nenhuma.
ignore = []

[licenses]
version = 2
# rand, rand_chacha e serde são "MIT OR Apache-2.0". Uma licença nova pede decisão consciente.
# Unicode-3.0 (aprovada em 2026-11-05): licença permissiva dos dados de Unicode, exigida pelo
# unicode-ident, que o syn usa para compilar o serde_derive. Detalhes na wiki 43.
allow = ["MIT", "Apache-2.0", "Unicode-3.0"]
confidence-threshold = 0.9

[bans]
# Duas versões do mesmo crate não é falha, mas aparece como aviso no log.
multiple-versions = "warn"
wildcards = "deny"
# Dependência por caminho dentro do workspace (sudoku-game → sudoku-core) não tem versão, e o
# cargo-deny a trataria como curinga. Esta opção libera só esse caso, e só em crates com
# publish = false; curingas de crates do crates.io continuam proibidos.
allow-wildcard-paths = true

[sources]
# Só o crates.io: nada de dependência direto de um repositório git ou de outro registry.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
