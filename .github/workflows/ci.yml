# CI do workspace: formatação, lint, build e testes em Linux, Windows e macOS.
# Garante automaticamente as regras do CLAUDE.md antes de qualquer merge no master.
name: CI

on:
  push:
    branches: [master]
  pull_request:

# Um push novo no mesmo PR/branch cancela a execução anterior, que já ficou obsoleta.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Qualquer warning do compilador vira erro: "build sem warnings" deixa de ser combinado.
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: Formatação
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    name: Testes (${{ matrix.os }})
    strategy:
      # Uma falha num SO não cancela os outros: queremos ver o quadro completo.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # --locked falha se o Cargo.lock estiver desatualizado em relação ao Cargo.toml.
      # --all-features liga a feature serde do sudoku-game; o build e o primeiro teste sem ela
      # provam que o crate também compila sem o serde.
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
      - run: cargo test --workspace --all-features --locked

  # Cobertura de testes com o cargo-llvm-cov. Só informa: o relatório vai para o resumo do job
  # (aba Summary da execução), sem serviço externo, sem token e sem porcentagem mínima. Um SO
  # basta, porque o core é o mesmo código em todos.
  coverage:
    name: Cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      # Action do próprio autor do cargo-llvm-cov: baixa o binário pronto em vez de compilar.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      # Gera o relatório antes de escrever o resumo: se os testes falharem, o step falha.
      - run: cargo llvm-cov --workspace --all-features --locked --summary-only > coverage.txt
      - run: |
          {
            echo '## Cobertura de testes'
            echo '```'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # App web: o sudoku-wasm compilado para WebAssembly e o frontend Svelte. Um SO basta: o .wasm e o
  # JavaScript são os mesmos em qualquer sistema.
  web:
    name: App web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Binário pronto do wasm-pack, em vez de compilar com `cargo install` a cada execução.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      # npm ci instala exatamente o que está no package-lock.json, e falha se ele estiver
      # desatualizado: o mesmo papel do --locked do Cargo.
      - run: npm ci
      - run: npm run build:wasm
      - run: npm run check
      - run: npm test
      # O build roda o build:wasm de novo; o cache do Cargo deixa essa segunda vez rápida.
      - run: npm run build
