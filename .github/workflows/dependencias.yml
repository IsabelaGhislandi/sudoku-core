# Verificação das dependências do workspace com o cargo-deny: vulnerabilidades conhecidas
# (RustSec), crates sem manutenção ou retirados, licenças e origem dos crates.
# Regras em deny.toml (raiz); motivos em docs/wiki/28-seguranca-de-dependencias.md.
name: Dependências

on:
  push:
    branches: [master]
  pull_request:
  # Vulnerabilidades novas são publicadas sem que nada mude no repositório: toda segunda,
  # 6h UTC, a verificação roda de novo com o código parado.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# O job só lê o repositório; nada de permissão de escrita.
permissions:
  contents: read

jobs:
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Versão fixa e --locked: instala sempre o mesmo cargo-deny, com as mesmas dependências.
      # Compilar do crates.io evita mais uma action de terceiros no pipeline.
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny check
